[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dummy-llm-test"
version = "0.2.0"
description = "Reproducible community LLM checks, model fingerprints, and regression reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["click>=8.1,<9", "httpx>=0.28,<1", "PyYAML>=6,<7", "numpy>=1.26,<3", "defusedxml>=0.7,<1"]

[project.scripts]
dummy-llm-test = "dummy_llm_test.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "dummy_llm_test/data/THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["src/dummy_llm_test/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
