[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dummy-llm-test"
version = "0.4.0"
description = "Reproducible community LLM checks, model fingerprints, and regression reports"
readme = "README.en.md"
authors = [{name = "dummy-llm-test contributors"}]
license = {file = "LICENSE"}
keywords = ["llm", "evaluation", "regression", "model-fingerprint"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = ["click>=8.1,<9", "httpx>=0.28,<1", "PyYAML>=6,<7", "numpy>=1.26,<3", "defusedxml>=0.7,<1"]

[project.urls]
Homepage = "https://github.com/antropy-research/dummy-llm-test"
Repository = "https://github.com/antropy-research/dummy-llm-test"
Documentation = "https://github.com/antropy-research/dummy-llm-test/blob/main/README.en.md"
Issues = "https://github.com/antropy-research/dummy-llm-test/issues"
Changelog = "https://github.com/antropy-research/dummy-llm-test/blob/main/CHANGELOG.md"

[project.scripts]
dummy-llm-test = "dummy_llm_test.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "dummy_llm_test/data/THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["src/dummy_llm_test/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/scripts", "/docs", "/.agents/skills", "/.github", "/.gitignore",
  "/README.md", "/README.en.md", "/CONTRIBUTING.md", "/SECURITY.md", "/CHANGELOG.md",
  "/AGENTS.md", "/CLAUDE.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/config.yaml",
  "/pyproject.toml", "/uv.lock", "/examples/validation-observations.json",
  "/examples/config-api.yaml", "/examples/config-cli.yaml", "/examples/shared-report",
]
